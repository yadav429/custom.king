
<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player Data</title></head>
<body style="background:#101827;color:white;font-family:Arial">
<h1>Registered Players</h1>
{% for p in players %}
<div style="background:#243247;padding:12px;margin:10px">
Name: {{ p['name'] }}<br>
UID: {{ p['uid'] }}<br>
Phone: {{ p['phone'] }}
</div>
{% else %}
<p>No Players Found</p>
{% endfor %}
<a href="/dashboard">Back</a>
</body>
</html>
