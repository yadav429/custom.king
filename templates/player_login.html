
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Login</title>
<style>
body{background:#080808;color:white;font-family:Arial;text-align:center;padding:25px}
.card{background:#222;padding:25px;border-radius:15px;margin-top:40px}
input{padding:14px;width:90%;margin:10px 0;box-sizing:border-box}
button{background:orangered;color:white;padding:14px;border:0;width:95%}
a{color:orange}
</style>
</head>
<body>
<div class="card">
<h1>🔥 CUSTOM KING FF</h1>
<h2>Player Login</h2>

<form method="POST">
<input name="uid" placeholder="Free Fire UID" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>

<p><a href="/player/activate">Activate Old Account</a></p>
<p><a href="/register">New Player Registration</a></p>
</div>
</body>
</html>
